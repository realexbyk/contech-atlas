<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3efe6">
<title>The Atlas — the map of construction technology</title>
<meta name="description" content="Explore construction technology layer by layer. The ConTech Atlas app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3efe6;--card:#f7f3eb;--hair:rgba(43,46,54,.22);--hair2:rgba(43,46,54,.4);
    --txt:#23262e;--dim:#535966;--faint:#8b9099;--ink:#2b2e36;
    --accent:#c9432f;--accent2:#c9432f;--amber:#2b2e36;--green:#2b2e36;--lc:#2b2e36;--mark:#c9432f;--tl:#2f9e9e;
    --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Mono',ui-monospace,monospace;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  /* drafting grid on the paper */
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(43,46,54,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(43,46,54,.045) 1px,transparent 1px),
      linear-gradient(rgba(43,46,54,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(43,46,54,.08) 1px,transparent 1px);
    background-size:24px 24px,24px 24px,120px 120px,120px 120px;}
  /* sheet border frame */
  body::after{content:'';position:fixed;inset:8px;z-index:60;pointer-events:none;
    border:1px solid rgba(43,46,54,.5);outline:1px solid rgba(43,46,54,.16);outline-offset:3px;}
  /* drawing title block */
  #tblock{position:fixed;right:16px;bottom:16px;z-index:61;pointer-events:none;
    border:1px solid rgba(43,46,54,.55);background:rgba(247,243,235,.88);
    font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--dim);line-height:1;}
  #tblock div{padding:5px 10px;border-top:1px solid rgba(43,46,54,.22);display:flex;gap:14px;justify-content:space-between;}
  #tblock div:first-child{border-top:none;color:var(--txt);font-size:9.5px;letter-spacing:.2em;}
  #tblock b{font-weight:500;color:var(--txt);}
  @media(max-width:900px){#tblock{display:none;}}

  /* top bar */
  .bar{position:fixed;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;
    padding:0 18px;padding-top:env(safe-area-inset-top);z-index:50;
    background:linear-gradient(180deg,#f3efe6 62%,transparent);}
  .bar .brand{font-weight:600;font-size:12px;letter-spacing:.18em;white-space:nowrap;font-family:var(--mono);color:var(--txt);text-decoration:none;}
  .bar .brand span{color:var(--mark);}
  .bar .title{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:center;}
  .bbtn{min-width:38px;height:38px;border:1px solid var(--hair2);background:rgba(247,243,235,.9);color:var(--dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;padding:0 12px;
    display:flex;align-items:center;justify-content:center;border-radius:2px;transition:.15s;}
  .bbtn:hover{color:var(--txt);border-color:var(--ink);}

  /* ============ SCENE 1 — OVERVIEW · ISOMETRIC STACK ============ */
  #ov{position:fixed;inset:0;overflow:hidden;transition:opacity .32s ease;cursor:grab;touch-action:none;
    --rx:55deg;--rz:-45deg;--ty:0px;--sc:1;--ps:min(68vmin,460px);}
  #ov.drag{cursor:grabbing;}
  #ov.hide{opacity:0;pointer-events:none;}
  #ov::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(55% 45% at 50% 52%,rgba(43,46,54,.035),transparent 70%);}
  .ovhint{position:absolute;top:calc(64px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:5;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint);pointer-events:none;}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1500px;}
  #stack{position:relative;width:var(--ps);height:var(--ps);transform-style:preserve-3d;
    transform:translateY(var(--ty)) scale(var(--sc)) rotateX(var(--rx)) rotateZ(var(--rz));
    transition:transform .5s cubic-bezier(.22,.9,.3,1);}
  #ov.drag #stack{transition:none;}
  .plate{position:absolute;inset:0;transform-style:preserve-3d;border-radius:3px;cursor:pointer;
    border:1.5px solid color-mix(in srgb,var(--pc) 52%,rgba(43,46,54,.32));
    background:color-mix(in srgb,var(--pc) 9%,rgba(246,242,233,.52));
    box-shadow:0 10px 26px rgba(40,42,52,.08);
    transition:transform .55s cubic-bezier(.3,.8,.3,1),opacity .38s,border-color .25s;}
  /* hatched margin band — drafting poché, tinted per layer */
  .plate::before{content:'';position:absolute;inset:0;border-radius:3px;pointer-events:none;padding:9px;
    background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--pc) 30%,rgba(43,46,54,.10)) 0 1px,transparent 1px 7px);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;}
  .plate::after{content:'';position:absolute;inset:9px;pointer-events:none;
    border:1px solid rgba(43,46,54,.34);
    background-image:repeating-linear-gradient(0deg,transparent 0 39px,rgba(43,46,54,.10) 39px 40px),
      repeating-linear-gradient(90deg,transparent 0 39px,rgba(43,46,54,.10) 39px 40px);}
  .plate:hover{border-color:var(--ink);}
  .plate.dim{opacity:0;pointer-events:none;}
  .plate.peek{opacity:.13;}
  /* billboarded children — stand upright facing the camera */
  .bb{transform-origin:0 100%;transform:rotateZ(calc(var(--rz)*-1)) rotateX(calc(var(--rx)*-1));}
  /* 2D HUD layer labels — dimension-callout style, always readable */
  .hud{position:absolute;top:0;left:max(12px,env(safe-area-inset-left));z-index:6;display:flex;align-items:center;gap:8px;
    white-space:nowrap;cursor:pointer;text-align:left;
    background:rgba(247,243,235,.92);border:1px solid var(--hair2);border-radius:2px;
    padding:6px 11px;font-family:var(--mono);letter-spacing:.08em;
    animation:hudin .5s ease backwards;
    transition:transform .5s cubic-bezier(.22,.9,.3,1),border-color .15s;}
  .hud::after{content:'';position:absolute;left:100%;top:50%;width:26px;height:1px;
    background:repeating-linear-gradient(90deg,rgba(47,158,158,.65) 0 4px,transparent 4px 8px);}
  #ov.drag .hud{transition:border-color .15s;}
  @keyframes hudin{from{opacity:0;}}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.72);opacity:0;}}
  .pill{animation:pop .34s cubic-bezier(.2,.9,.3,1.35) backwards;}
  .hud:hover{border-color:var(--mark);}
  .hud .tno{font-size:10.5px;color:var(--hc);font-weight:600;}
  .hud .tnm{font-size:11px;font-weight:600;color:var(--txt);letter-spacing:.1em;}
  .hud .tct{font-size:9px;color:var(--tl);}
  @media(max-width:720px){.hud{padding:5px 8px;gap:5px;}.hud .tnm{font-size:8.5px;}.hud .tno{font-size:9px;}.hud::after{width:14px;}}
  /* unified layer rail — the one navigator, left edge, layer mode only */
  #rail{position:fixed;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);
    z-index:46;display:none;flex-direction:column;gap:5px;}
  body.layer-mode #rail{display:flex;}
  .ri{display:flex;align-items:center;gap:9px;border:1px solid var(--hair);background:rgba(247,243,235,.96);
    padding:9px 11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim);
    cursor:pointer;border-radius:2px;text-align:left;transition:border-color .15s,color .15s;}
  .ri i{width:7px;height:7px;border-radius:50%;background:var(--rc);flex:none;}
  .ri b{font-weight:600;color:var(--txt);}
  .ri .rn{white-space:nowrap;letter-spacing:.1em;}
  .ri:hover{border-color:var(--hair2);color:var(--txt);}
  .ri.on{border-color:var(--rc);border-left-width:3px;color:var(--txt);}
  .ri.home{color:var(--txt);border-color:var(--hair2);margin-bottom:8px;}
  @media(max-width:720px){
    #rail{left:8px;gap:4px;}
    .ri{padding:8px 8px;gap:0;}
    .ri .rn{display:none;}
    .ri i{margin-right:6px;}
  }
  .mini,.pill{transition-property:opacity,transform,border-color,box-shadow,color;transition-duration:.3s;}
  /* zoom controls — right middle, clear of the title block */
  #zoomctl{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;
    flex-direction:column;gap:0;z-index:52;border:1px solid var(--hair2);border-radius:2px;overflow:hidden;}
  #zoomctl button{width:44px;height:44px;border:none;background:rgba(247,243,235,.95);color:var(--txt);
    font-size:18px;cursor:pointer;transition:.15s;font-family:var(--mono);}
  #zoomctl button:hover{background:rgba(43,46,54,.08);}
  #zoomctl button:active{background:rgba(201,67,47,.15);}
  #zlv{width:44px;padding:6px 0;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;
    color:var(--tl);background:rgba(247,243,235,.95);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
  .chip img{width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:6px;}
  /* domain line icons */
  .dico{width:13px;height:13px;flex:none;display:inline-block;}
  .dico *{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .mini .dico{color:color-mix(in srgb,var(--pc) 62%,var(--ink));}
  .pill .dico{width:16px;height:16px;color:color-mix(in srgb,var(--lc) 55%,var(--ink));}
  #sheet h2 .dico{width:19px;height:19px;vertical-align:-3px;margin-right:9px;color:var(--ink);}
  .sres .dico{width:15px;height:15px;color:var(--dim);}
  .mini{position:absolute;display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;
    font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--txt);
    background:rgba(247,243,235,.9);border:1px solid var(--hair2);
    border-radius:2px;padding:4px 8px;transition:border-color .15s,color .15s,font-size .2s,padding .2s;}
  .mini::after{content:'';position:absolute;inset:-9px;}
  .mini:hover{border-color:var(--mark);z-index:9;}
  .mini.sel{border-color:var(--mark);box-shadow:0 0 0 1px var(--mark);z-index:9;}
  .ovln.hot{stroke:var(--mark);stroke-width:2.2;}
  #ov.far .mini{font-size:0;gap:0;padding:5px;}
  #ov.far .mini .dico{width:13px;height:13px;}
  /* heavier pen weight when zoomed out so the drawing never fades */
  #ov.far .plate{border-width:2.5px;border-color:color-mix(in srgb,var(--pc) 68%,rgba(43,46,54,.6));}
  #ov.far .plate::after{border-width:2px;border-color:rgba(43,46,54,.45);}
  /* cross-layer flow lines in the overview — screen-space overlay */
  #ovlinks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;}
  .ovln{stroke:rgba(47,158,158,.30);stroke-width:1.4;}
  #ov.far .ovln{stroke-width:2;stroke:rgba(47,158,158,.42);}
  /* construction lines between plates */
  .beam{position:absolute;width:0;height:70px;pointer-events:none;overflow:visible;
    border-left:1px dashed rgba(47,158,158,.42);}
  .beam::after{display:none;}
  @media(max-width:720px){
    #ov{--ps:min(72vmin,460px);}
    .mini{font-size:8.5px;padding:4px 7px;gap:4px;}
    #zoomctl{right:8px;}
  }

  /* ============ SCENE 2 — LAYER ============ */
  #ly{position:fixed;inset:0;padding-top:calc(88px + env(safe-area-inset-top));
    padding-left:calc(216px + env(safe-area-inset-left));padding-right:24px;padding-bottom:34px;
    opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;transform:scale(.96);}
  #ly.show{opacity:1;pointer-events:auto;transform:none;}
  #ly::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(62% 52% at 56% 42%,color-mix(in srgb,var(--lc) 8%,transparent),transparent 72%);}
  @media(max-width:720px){#ly{padding-left:52px;}}
  #lywrap{position:relative;width:100%;height:100%;overflow:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1);}
  #lywrap.scrollv{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
  @media(min-width:1001px){#ly.sheet-open #lywrap{transform:translateX(-210px);}}
  @media(pointer:fine){#lywrap:not(.scrollv){cursor:grab;}}
  #pills,#lysvg{transition:transform .18s ease;}
  #pills{position:relative;width:100%;}
  #lysvg{position:absolute;top:0;left:0;width:100%;height:100%;}
  /* neighbor sheets — feel the stack around you */
  #nbrTop,#nbrBot{position:absolute;left:0;right:0;height:30px;z-index:6;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;border:none;
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);transition:color .15s;}
  #nbrTop{top:calc(58px + env(safe-area-inset-top));
    border-bottom:1.5px dashed color-mix(in srgb,var(--nct) 55%,transparent);
    background:linear-gradient(180deg,color-mix(in srgb,var(--nct) 16%,transparent),transparent);}
  #nbrBot{bottom:0;height:34px;
    border-top:1.5px dashed color-mix(in srgb,var(--ncb) 55%,transparent);
    background:linear-gradient(0deg,color-mix(in srgb,var(--ncb) 16%,transparent),transparent);}
  #nbrTop:hover,#nbrBot:hover{color:var(--txt);}
  .pill{position:absolute;transform:translate(-50%,-50%);border:1.5px solid var(--hair2);background:rgba(247,243,235,.98);
    color:var(--txt);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:12px 16px;border-radius:2px;cursor:pointer;white-space:nowrap;
    transition:border-color .18s,box-shadow .18s,opacity .3s;
    display:flex;align-items:center;gap:8px;}
  .pill:hover{border-color:var(--ink);box-shadow:2px 2px 0 rgba(43,46,54,.18);z-index:5;}
  .pill.sel{border-color:var(--mark);box-shadow:2px 2px 0 rgba(201,67,47,.25),0 0 0 1px var(--mark);z-index:6;}
  .pill .ai{width:6px;height:6px;border-radius:50%;border:1px solid var(--mark);background:transparent;}
  .pill .fl{font-size:9px;color:var(--tl);font-weight:500;opacity:0;transition:opacity .15s;}
  .pill:hover .fl,.pill.sel .fl{opacity:1;}
  /* red-pencil focus: selection calms everything else (QW4) */
  #ly.focus .pill:not(.sel):not(.rel){opacity:.35;}
  #ly.focus .edge:not(.hot){opacity:.12;}
  #ly.focus .port{opacity:.3;}
  #ly.focus .term{opacity:.25;}
  .term{fill:rgba(43,46,54,.55);}
  .no-anim .pill{animation:none;}
  /* ghost sheet numeral — vectorworks-style */
  #lynum{position:absolute;right:4%;bottom:8%;z-index:0;pointer-events:none;font-family:var(--mono);
    font-size:min(38vh,340px);font-weight:600;line-height:1;
    color:color-mix(in srgb,var(--lc) 26%,transparent);opacity:.16;}
  .pill.govp{border-style:dashed;}
  .pill.govp.sel{border-color:var(--mark);}
  .pill.fabp{border-style:dotted;}
  .pill.fabp.sel{border-color:var(--mark);}
  /* cross-layer ports */
  .port{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
    border:1px solid var(--hair);background:rgba(247,243,235,.92);color:var(--dim);font-family:var(--mono);
    font-size:8.5px;letter-spacing:.08em;padding:5px 9px;border-radius:2px;cursor:pointer;white-space:nowrap;
    transition:border-color .15s,color .15s;z-index:4;}
  .port{border-color:rgba(47,158,158,.45);color:#33706f;}
  .port:hover{border-color:var(--mark);color:var(--mark);}
  .port b{font-weight:600;color:var(--tl);}
  .edge{stroke:rgba(43,46,54,.5);stroke-width:1.6;fill:none;transition:.2s;}
  .edge.xp{stroke-dasharray:4 5;stroke:rgba(47,158,158,.42);stroke-width:1.4;}
  .edge.hot{stroke:var(--mark);opacity:1;stroke-width:2.2;stroke-dasharray:none;}
  @media(max-width:720px){.pill{font-size:10px;padding:10px 12px;}.port{font-size:7.5px;padding:4px 7px;}}

  /* detail sheet — drawing annotation panel */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:66dvh;overflow-y:auto;
    background:rgba(248,244,236,.98);backdrop-filter:blur(14px);border-top:1px solid var(--ink);
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.9,.25,1);}
  #sheet.open{transform:none;}
  .grab{width:44px;height:3px;background:var(--hair2);margin:6px auto 14px;}
  #sheet .lk{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--mark);text-transform:uppercase;}
  #sheet h2{font-family:var(--mono);font-size:17px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 8px;font-weight:600;}
  #sheet p{font-size:12.5px;line-height:1.7;color:var(--dim);}
  #sheet .gv{margin-top:12px;border-left:2px solid var(--mark);padding:2px 0 2px 12px;font-size:11.5px;color:#a84534;line-height:1.65;}
  #sheet .sec{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint);margin:16px 0 8px;text-transform:uppercase;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--hair);background:rgba(43,46,54,.04);
    padding:6px 10px;border-radius:2px;}
  .chip.link{cursor:pointer;color:var(--txt);border-color:var(--hair2);}
  .chip.link:hover{border-color:var(--mark);color:var(--mark);}
  .conn-line{font-size:12px;color:var(--dim);line-height:1.7;}
  @media(min-width:1001px){
    #sheet{left:auto;right:20px;bottom:20px;width:400px;border:1px solid var(--ink);
      max-height:calc(100dvh - 120px);transform:translateX(118%);}
    #sheet.open{transform:none;}
    .grab{display:none;}
  }
  .shx{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;}
  .shx:hover{color:var(--mark);}

  /* search overlay */
  #srch{position:fixed;inset:0;z-index:90;background:rgba(243,239,230,.97);backdrop-filter:blur(8px);display:none;
    padding:calc(20px + env(safe-area-inset-top)) 16px 16px;}
  #srch.open{display:block;}
  #srch input{width:100%;max-width:640px;margin:0 auto;display:block;background:rgba(247,243,235,.95);border:1px solid var(--hair2);
    color:var(--txt);font-family:var(--mono);font-size:16px;padding:15px 18px;border-radius:2px;outline:none;}
  #srch input:focus{border-color:var(--mark);}
  #srele{max-width:640px;margin:14px auto 0;display:flex;flex-direction:column;gap:6px;max-height:70dvh;overflow-y:auto;}
  .sres{display:flex;align-items:center;gap:12px;border:1px solid var(--hair);background:rgba(247,243,235,.9);
    border-radius:2px;padding:13px 16px;cursor:pointer;transition:.15s;}
  .sres:hover{border-color:var(--mark);}
  .sres b{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;}
  .sres span{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.1em;margin-left:auto;white-space:nowrap;}
  .sx{display:block;margin:16px auto 0;background:none;border:1px solid var(--hair);color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:9px 16px;border-radius:2px;cursor:pointer;}
</style>
</head>
<body>

<div class="bar">
  <button class="bbtn" onclick="openSearch()" aria-label="Search">⌕</button>
  <a class="brand" href="index.html">THE<span>ATLAS</span></a>
  <div class="title" id="barTitle">ALL LAYERS</div>
</div>

<div id="ov"></div>

<nav id="rail" aria-label="Layers"></nav>

<div id="zoomctl">
  <button id="zin" aria-label="Zoom in">+</button>
  <div id="zlv">100%</div>
  <button id="zout" aria-label="Zoom out">−</button>
</div>

<div id="ly">
  <div id="lynum" aria-hidden="true"></div>
  <button id="nbrTop" onclick="navLayer(-1)"></button>
  <div id="lywrap">
    <svg id="lysvg"></svg>
    <div id="pills"></div>
  </div>
  <button id="nbrBot" onclick="navLayer(1)"></button>
</div>

<div id="tblock" aria-hidden="true">

/* orbit + travel + zoom input — with inertia */
(function(){
  const ov=document.getElementById('ov');
  const pts=new Map();
  let px=0,py=0,down=false,pinchD=0,pinchS=1,vx=0,vy=0,coastId=null;
  const lim=()=>Math.max(150,LAYERS.length*SP*0.45);
  function coast(){
    vx*=.95;vy*=.95;
    if(Math.abs(vx)+Math.abs(vy)<.4){ov.classList.remove('drag');coastId=null;return;}
    vRz=Math.max(-72,Math.min(-18,vRz-vx*0.28));
    vTy=Math.max(-lim(),Math.min(lim(),vTy+vy));
    applyView();
    coastId=requestAnimationFrame(coast);
  }
  ov.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(coastId){cancelAnimationFrame(coastId);coastId=null;ov.classList.remove('drag');}
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){down=true;dragMoved=false;vx=0;vy=0;px=e.clientX;py=e.clientY;}
    else if(pts.size===2){
      const a=[...pts.values()];
      pinchD=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);pinchS=vSc;
      dragMoved=true;ov.classList.add('drag');
    }
  });
  ov.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      if(pinchD>0){vSc=Math.max(.4,Math.min(2.6,pinchS*d/pinchD));applyView();}
      return;
    }
    if(!down)return;
    const thr=e.pointerType==='touch'?11:5;
    if(!dragMoved){
      if(Math.abs(e.clientX-px)+Math.abs(e.clientY-py)<=thr)return;
      dragMoved=true;ov.classList.add('drag');
      px=e.clientX;py=e.clientY;return;
    }
    const dx=e.clientX-px,dy=e.clientY-py;
    px=e.clientX;py=e.clientY;
    vx=0.75*vx+0.25*dx;vy=0.75*vy+0.25*dy;
    vRz=Math.max(-72,Math.min(-18,vRz-dx*0.28));
    vTy=Math.max(-lim(),Math.min(lim(),vTy+dy));
    applyView();
  });
  const end=e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)pinchD=0;
    if(pts.size===1){const r=[...pts.values()][0];px=r[0];py=r[1];down=true;vx=0;vy=0;}
    if(pts.size===0){
      down=false;
      if(dragMoved&&Math.abs(vx)+Math.abs(vy)>3){coastId=requestAnimationFrame(coast);}
      else ov.classList.remove('drag');
      setTimeout(()=>{dragMoved=false;},60);
    }
  };
  ov.addEventListener('pointerup',end);
  ov.addEventListener('pointercancel',end);
  ov.addEventListener('wheel',e=>{
    e.preventDefault();
    /* wheel = zoom; travel happens by dragging */
    vSc=Math.max(.4,Math.min(2.6,vSc-e.deltaY*0.0022));
    applyView();
  },{passive:false});
  ov.addEventListener('dblclick',e=>{
    if(e.target.closest('.hud')||e.target.closest('.mini'))return;
    vSc=vSc<1.2?1.55:1;applyView();
  });
})();

/* ---------------- LAYER SCENE ---------------- */
function openLayer(id,selId){
  curLayer=id;
  const l=layerOf[id];
  const li=LAYERS.findIndex(x=>x.id===id);
  document.getElementById('barTitle').textContent=l.no+' · '+l.name;
  const tb=document.getElementById('tbSheet');
  if(tb)tb.textContent='L-'+(li+1<10?'0':'')+(li+1)+' · '+l.name;
  document.documentElement.style.setProperty('--lc',l.c);
  const ln=document.getElementById('lynum');
  if(ln)ln.textContent=l.no;
  document.body.classList.add('layer-mode');
  /* neighbor sheets above and below */
  const up=LAYERS[(li-1+LAYERS.length)%LAYERS.length],dn=LAYERS[(li+1)%LAYERS.length];
  const nt=document.getElementById('nbrTop'),nb=document.getElementById('nbrBot');
  nt.style.setProperty('--nct',up.c);nt.innerHTML='↑ '+up.no+' · '+up.name;
  nb.style.setProperty('--ncb',dn.c);nb.innerHTML='↓ '+dn.no+' · '+dn.name;
  document.getElementById('ov').classList.add('hide');
  const ly=document.getElementById('ly');
  const pillsEl=document.getElementById('pills');
  const svg=document.getElementById('lysvg');
  pillsEl.innerHTML='';svg.innerHTML='';
  const nodes=N.filter(n=>n.l===id);
  const wrap=document.getElementById('lywrap');
  const Wp=wrap.clientWidth,HpV=wrap.clientHeight;
  const count=nodes.length;
  const isM=Wp<=720;
  /* cross-layer ports (computed first so padding can fit them) */
  const ports={};
  E.forEach(([a,b])=>{
    const aIn=byId[a].l===id,bIn=byId[b].l===id;
    if(aIn===bIn)return;
    const src=aIn?a:b,tgt=aIn?b:a;
    if(!ports[tgt])ports[tgt]={tgt,srcs:new Set()};
    ports[tgt].srcs.add(src);
  });
  const curIdx=LAYERS.findIndex(x=>x.id===id);
  const tops=[],bots=[];
  Object.values(ports).forEach(p=>{
    const ti=LAYERS.findIndex(x=>x.id===byId[p.tgt].l);
    (ti<curIdx?tops:bots).push(p);
  });
  const perRow=isM?3:99;
  const topRows=Math.ceil(tops.length/perRow),botRows=Math.ceil(bots.length/perRow);
  /* snap everything to the 24px paper grid (compensate #ly padding offsets) */
  const OX=isM?52:216,OY=88;
  const gx=v=>Math.round((v+OX)/24)*24-OX;
  const gy=v=>Math.round((v+OY)/24)*24-OY;
  /* fixed drafting rhythm, centered block */
  const cols=isM?(count>4?2:1):(count>8?4:count>3?Math.ceil(count/2):count);
  const rows=Math.ceil(count/cols);
  const rowH=isM?96:120;
  const blockH=rows*rowH;
  const topPad=isM?(60+topRows*40):Math.max(96,(HpV-blockH)/2);
  const botPad=isM?(120+botRows*40):Math.max(96,HpV-topPad-blockH);
  const Hc=isM?(topPad+blockH+botPad):HpV;
  wrap.classList.toggle('scrollv',isM);
  wrap.scrollTop=0;
  pillsEl.style.height=Hc+'px';
  svg.setAttribute('viewBox','0 0 '+Wp+' '+Hc);
  svg.style.height=Hc+'px';
  const span=Math.min(Wp*0.84,cols*264);
  const x0=(Wp-span)/2;
  const posById={};
  nodes.forEach((n,i)=>{
    const p=document.createElement('button');
    p.className='pill'+(l.cls==='gov'?' govp':l.cls==='fab'?' fabp':'');
    p.id='pill-'+n.id;
    const conns=connsOf(n.id);
    const outL=conns.filter(c=>byId[c.id].l!==id).length;
    p.innerHTML=dico(n.id)+(n.ai?'<span class="ai"></span>':'')+n.n+'<span class="fl">'+outL+' ext</span>';
    const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(count-r*cols,cols);
    const x=gx(x0+(c+0.5)*(span/inRow));
    const y=gy(topPad+(r+0.5)*rowH);
    p.style.left=x+'px';p.style.top=y+'px';
    if(!pillsEl.classList.contains('no-anim'))p.style.animationDelay=(i*30)+'ms';
    p.onclick=()=>selectNode(n.id);
    p.onmouseenter=()=>{if(curSel!==n.id)document.querySelectorAll('#lysvg .edge').forEach(e2=>{
      if(e2.dataset.a===n.id||e2.dataset.b===n.id)e2.classList.add('hot');});};
    p.onmouseleave=()=>{document.querySelectorAll('#lysvg .edge.hot').forEach(e2=>{
      if(!(curSel&&(e2.dataset.a===curSel||e2.dataset.b===curSel)))e2.classList.remove('hot');});};
    pillsEl.appendChild(p);
    posById[n.id]={x,y};
  });
  /* edges — anchored short of centers with schematic terminals */
  const NS='http://www.w3.org/2000/svg';
  function dot(x,y,r){const c2=document.createElementNS(NS,'circle');
    c2.setAttribute('cx',x);c2.setAttribute('cy',y);c2.setAttribute('r',r||2.5);
    c2.setAttribute('class','term');svg.appendChild(c2);}
  function link(A,B,cls,a,b){
    const dx=B.x-A.x,dy=B.y-A.y,dist=Math.hypot(dx,dy)||1;
    const t=Math.min(26,dist*0.3)/dist;
    const ax=A.x+dx*t,ay=A.y+dy*t,bx=B.x-dx*t,by=B.y-dy*t;
    const mx=(ax+bx)/2,my=(ay+by)/2-Math.min(40,dist*0.15);
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d','M '+ax+' '+ay+' Q '+mx+' '+my+' '+bx+' '+by);
    path.setAttribute('class',cls);
    if(a){path.dataset.a=a;path.dataset.b=b;}
    svg.appendChild(path);
    dot(ax,ay);dot(bx,by);
  }
  E.forEach(([a,b])=>{
    if(byId[a].l===id&&byId[b].l===id)link(posById[a],posById[b],'edge',a,b);
  });
  /* labeled ports — snapped to source columns, trunked when busy */
  const avgX=p=>[...p.srcs].reduce((s,x)=>s+posById[x].x,0)/p.srcs.size;
  tops.sort((a,b)=>avgX(a)-avgX(b));bots.sort((a,b)=>avgX(a)-avgX(b));
  function placePorts(list,yBase,arrow,stackDown){
    let lastX=-1e9,lastRow=-1;
    list.forEach((p,i)=>{
      const t=byId[p.tgt],tl=layerOf[t.l];
      const row=Math.floor(i/perRow);
      let x=gx(avgX(p));
      if(row===lastRow&&x<lastX+120)x=lastX+120;
      lastRow=row;lastX=x;
      x=Math.max(70,Math.min(Wp-70,x));
      const y=yBase+(stackDown?1:-1)*row*40;
      const el=document.createElement('button');
      el.className='port';
      el.style.left=x+'px';el.style.top=y+'px';
      el.innerHTML=arrow+' '+t.n+' <b>'+tl.no+'</b>';
      el.onclick=()=>travel(p.tgt);
      pillsEl.appendChild(el);
      const srcs=[...p.srcs],P={x,y};
      if(srcs.length>=3){
        const cx2=gx(srcs.reduce((s,q)=>s+posById[q].x,0)/srcs.length);
        const sy=srcs.reduce((s,q)=>s+posById[q].y,0)/srcs.length;
        const J={x:cx2,y:gy((y+sy)/2)};
        link(P,J,'edge xp');
        dot(J.x,J.y,3.2);
        srcs.forEach(s2=>link(J,posById[s2],'edge xp',s2,p.tgt));
      }else{
        srcs.forEach(s2=>link(P,posById[s2],'edge xp',s2,p.tgt));
      }
    });
  }
  placePorts(tops,isM?44:38,'↑',true);
  placePorts(bots,Hc-(isM?56:38),'↓',false);
  document.getElementById('zoomctl').style.display='none';
  ly.classList.add('show');
  renderRail();
  if(selId)setTimeout(()=>selectNode(selId),250);
  else closeSheet();
}
function goOverview(){

window.travel=function(id){

  if(n.l===curLayer){selectNode(id);}
  else if(!curLayer){flyNode(n.l,id);}
  else{
    document.getElementById('ly').classList.remove('show');
    setTimeout(()=>openLayer(n.l,id),200);
  }
};
function closeSheet(){
  curSel=null;
  document.getElementById('sheet').classList.remove('open');
  document.querySelectorAll('.pill.sel,.pill.rel').forEach(p=>p.classList.remove('sel','rel'));
  document.querySelectorAll('.mini.sel').forEach(m=>m.classList.remove('sel'));
  document.querySelectorAll('.edge.hot').forEach(e=>e.classList.remove('hot'));
  document.getElementById('ly').classList.remove('focus','sheet-open');
}
/* drag-to-dismiss (the fix) */
(function(){
  const sh=document.getElementById('sheet');
  let sy=null,dy=0;
  sh.addEventListener('touchstart',e=>{
    if(sh.scrollTop>2)return;
    sy=e.touches[0].clientY;dy=0;
    sh.style.transition='none';
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(sy===null)return;
    dy=e.touches[0].clientY-sy;
    if(dy>0)sh.style.transform='translateY('+dy+'px)';
  },{passive:true});
  sh.addEventListener('touchend',()=>{
    sh.style.transition='';sh.style.transform='';
    if(dy>80)closeSheet();
    sy=null;dy=0;
  });
})();

/* mouse drag up/down inside a layer = previous/next sheet; wheel too */
(function(){
  const wrap=document.getElementById('lywrap');
  let sy=null,dy=0,active=false,wheelLock=0;
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0)return;
    if(e.target.closest('.pill,.port,#nbrTop,#nbrBot'))return;
    sy=e.clientY;dy=0;active=true;
  });
  wrap.addEventListener('pointermove',e=>{
    if(!active)return;
    dy=e.clientY-sy;
    const t=Math.max(-150,Math.min(150,dy))*0.6;
    document.getElementById('pills').style.transform='translateY('+t+'px)';
    document.getElementById('lysvg').style.transform='translateY('+t+'px)';
  });
  const end=()=>{
    if(!active)return;active=false;
    document.getElementById('pills').style.transform='';
    document.getElementById('lysvg').style.transform='';
    if(Math.abs(dy)>70)navLayer(dy<0?1:-1);
    sy=null;dy=0;
  };
  wrap.addEventListener('pointerup',end);
  wrap.addEventListener('pointercancel',end);
  wrap.addEventListener('mouseleave',end);
  wrap.addEventListener('wheel',e=>{
    if(wrap.classList.contains('scrollv'))return;
    e.preventDefault();
    const now=Date.now();
    if(now-wheelLock<550||Math.abs(e.deltaY)<18)return;
    wheelLock=now;
    navLayer(e.deltaY>0?1:-1);
  },{passive:false});
})();

/* ---------------- SEARCH ---------------- */
function openSearch(){
  document.getElementById('srch').classList.add('open');
  document.getElementById('srchIn').focus();
  renderResults('');
}
function closeSearch(){document.getElementById('srch').classList.remove('open');}
function renderResults(q){
  const el=document.getElementById('srele');el.innerHTML='';
  N.filter(n=>{
    if(!q)return true;
    return (n.n+' '+n.d+' '+(n.p||[]).join(' ')).toLowerCase().includes(q);
  }).slice(0,20).forEach(n=>{
    const l=layerOf[n.l];
    const d=document.createElement('div');d.className='sres';
    d.innerHTML=dico(n.id)+'<b>'+n.n+'</b><span>'+l.no+' · '+l.name+'</span>';
    d.onclick=()=>{closeSearch();travel(n.id);};
    el.appendChild(d);
  });
}
document.getElementById('srchIn').addEventListener('input',e=>renderResults(e.target.value.trim().toLowerCase()));
